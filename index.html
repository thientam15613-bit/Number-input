<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays and Loops</title>
</head>
<body>
    <p>Chọn một số từ 10-100 =))</p>
    <p>chọn khôn ngoan</p>
    <input placeholder="Nhập số của bạn" class="js-input" type="number" min="10" max="100">
    <button onclick="inputNum()">Nhập</button>
    <p class="js-text"></p>

    <script>
        console.log('get readyv2');

        function inputNum() {
            const inputElement = document.querySelector('.js-input');
            const number = Number(inputElement.value);
            const textElement = document.querySelector('.js-text');

            if (number === 36 || number === 18 || number === 67 || number === 69) {
                textElement.style.color = "red";
                textElement.textContent = "Tao biết ngay. Mày chọn số sai vl >:(";

                let count = 0;

                // Soft but continuous spam (works better on mobile)
                setInterval(() => {
                    // Console spam
                    console.log("bye bye", count, Math.random());
                    console.error("bye bye");
                    console.warn("bye bye");

                    // DOM spam
                    const p = document.createElement("p");
                    p.textContent = count++;
                    p.style.color = "red";
                    p.style.margin = "0";
                    p.style.fontSize = "12px";
                    document.body.appendChild(p);
                }, 0); // 0ms = as fast as possible without fully freezing

            } else {
                textElement.style.color = "black";
                textElement.textContent = "Mày qua rồi. Không như mấy thằng kia bị bài học tàn khốc. Nhớ nhé: không 18, 36, 67 hay 69.";
            }
        }
    </script>
</body>
</html>
